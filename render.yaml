services:
  - type: web
    name: stem-link-api
    plan: free
    runtime: node
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    rootDir: sample-projects/node-d01-example
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stem-link-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN_URL
        sync: false

databases:
  - name: stem-link-db
    plan: free
