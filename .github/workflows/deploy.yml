name: CI/CD Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sample-projects/node-d01-example/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sample-projects/node-d01-example

      - name: Build application
        run: npm run build
        working-directory: sample-projects/node-d01-example

  deploy:
    name: Trigger Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
